# STATUTORY ANCHORS — a second, independent axis of evidence.
#
# A percentile says "unusual compared to other contracts". An anchor says
# "unusual compared to what the law suggests". These are different kinds of
# evidence and the report presents them SEPARATELY rather than blending them
# into one score. Two independent signals pointing the same way is a much
# stronger finding than either alone.
#
# ─────────────────────────────────────────────────────────────────────────────
# SAFETY RULE — READ BEFORE ADDING ANYTHING
#
# Every anchor ships with `verified: false`. The scorer SKIPS unverified anchors
# and logs a warning. To enable one you must:
#   1. read the bare Act (indiacode.nic.in), not a summary, not a blog;
#   2. confirm the section number and the exact figure;
#   3. record who checked it and when;
#   4. set verified: true.
#
# A wrong statutory citation in a tool aimed at people without legal training is
# worse than no citation at all — it manufactures false confidence in exactly
# the person least able to detect the error. Do not skip this.
#
# ALSO NOTE: the Model Tenancy Act 2021 is a MODEL law. It binds nobody until a
# state adopts and notifies it, and states have amended it on adoption. The
# `applies_in` field is not decoration — the scorer uses it, and where the
# user's state has not adopted, the anchor is shown as guidance, never as law.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

anchors:

  security_deposit.deposit_months:
    residential:
      value: 2
      comparison: max            # anchor is a ceiling; above it is adverse
      unit: months_of_rent
      source: "Model Tenancy Act, 2021, s.11"
      instrument: model_tenancy_act_2021
      note: >
        The Model Tenancy Act 2021 provides that the security deposit may not
        exceed two months' rent for residential premises.
      quote: >
        "The security deposit may not exceed: (i) two months' rent for
        residential premises, and (ii) six-months' rent for non-residential
        premises."
      applies_in: [Assam, Uttar Pradesh]
      verified: true
      verified_by: "claude-opus-5 via PRS India Legislative Brief on the Model Tenancy Act 2021"
      verified_on: "2026-09-08"
    non_residential:
      value: 6
      comparison: max
      unit: months_of_rent
      source: "Model Tenancy Act, 2021, s.11"
      instrument: model_tenancy_act_2021
      note: >
        The higher cap of six months' rent applies to non-residential premises.
      quote: >
        "The security deposit may not exceed: (i) two months' rent for
        residential premises, and (ii) six-months' rent for non-residential
        premises."
      applies_in: [Assam, Uttar Pradesh]
      verified: true
      verified_by: "claude-opus-5 via PRS India Legislative Brief on the Model Tenancy Act 2021"
      verified_on: "2026-09-08"

  deposit_refund.refund_days:
    residential:
      value: 0
      comparison: max
      unit: days
      source: "Model Tenancy Act, 2021, s.11(2)"
      instrument: model_tenancy_act_2021
      note: >
        The Model Act provides for refund at the time of taking over vacant
        possession, after due deductions. It states NO waiting period, so any
        stated refund window departs from it. The 0 here encodes "at handover"
        and is an interpretation of the Act's wording, not a figure the Act
        contains — the report must therefore phrase this as "the Act provides
        for refund at handover", never as "the Act allows 0 days".
      quote: >
        "The security deposit will be refunded by the landlord to the tenant at
        the time of taking over vacant possession of the premises, after making
        due deductions."
      applies_in: [Assam, Uttar Pradesh]
      verified: true
      verified_by: "claude-opus-5 via PRS India Legislative Brief on the Model Tenancy Act 2021"
      verified_on: "2026-09-08"

  non_compete.noncompete_months:
    all:
      value: 0
      comparison: max
      unit: months
      source: "Indian Contract Act, 1872, s.27"
      instrument: indian_contract_act_1872
      note: >
        Section 27 makes an agreement restraining anyone from exercising a
        lawful profession, trade or business void TO THAT EXTENT. Indian courts
        have generally treated POST-employment non-compete restrictions as
        unenforceable, while restrictions DURING employment are treated
        differently; the one statutory exception concerns the sale of goodwill.
        This is the most useful anchor in the file for employment offers,
        because the clause is near-universal in Indian offer letters and often
        unenforceable as written.
        Phrase the finding as "commonly unenforceable in India", never as
        "void" — enforceability is fact-specific and this tool does not decide it.
      quote: >
        "27. Agreement in restraint of trade, void.— Every agreement by which
        any one is restrained from exercising a lawful profession, trade or
        business of any kind, is to that extent void."
      applies_in: [ALL_INDIA]
      verified: true
      verified_by: "claude-opus-5 via bare Act text, cross-checked against two independent sources"
      verified_on: "2026-09-08"

  # ── Anchors worth researching, deliberately left empty rather than guessed ──
  #
  # Do NOT populate these from memory or from a blog. Each needs the bare Act.
  #
  # notice_period.notice_months (employment)
  #     State Shops & Establishments Acts set minimum notice, and the figure
  #     VARIES BY STATE. There is no single national number. This must be a
  #     per-state table or it must not exist.
  #
  # rent_and_escalation.escalation_pct
  #     State Rent Control Acts, where they still apply, and the Model Tenancy
  #     Act's revision-notice provisions. Highly state-specific.
  #
  # bond_and_recovery.bond_amount_inr
  #     No statutory cap. Case law on reasonableness of liquidated damages
  #     (Indian Contract Act s.74) is the relevant frame, not a number.
  #     Probably better expressed as a qualitative flag than an anchor.
  #
  # entry_and_inspection.notice_hours
  #     Model Tenancy Act has a provision on the landlord's right of entry with
  #     prior notice. Confirm subsection and the period.

# Which states have adopted the Model Tenancy Act, and in what form.
# Adoption is ongoing and states amend on adoption — treat this as a snapshot
# with a date, re-check before each release, and never let it silently go stale.
model_tenancy_act_adoption:
  last_checked: "2026-09-08"
  checked_by: "claude-opus-5"
  source_url: "https://prsindia.org/billtrack/the-model-tenancy-act-2021"
  note: >
    The Model Tenancy Act is a MODEL law. It binds nobody until a state adopts
    and notifies it. As at the date above only four states had ratified it, and
    two of those legislated BEFORE the final Model Act was approved, so their
    figures may differ and are NOT assumed here. Karnataka and Maharashtra have
    announced rules based on the Act without formally adopting it.
    Re-check before any release: adoption is ongoing.
  states:
    Assam:          {adopted: true,  notified_on: "2021", deviations: "enacted after the Model Act"}
    Uttar Pradesh:  {adopted: true,  notified_on: "2021", deviations: "enacted after the Model Act"}
    Tamil Nadu:     {adopted: false, notified_on: "2017", deviations: "own tenancy law, PREDATES the Model Act; figures not verified here"}
    Andhra Pradesh: {adopted: false, notified_on: "2018", deviations: "own tenancy law, PREDATES the Model Act; figures not verified here"}
    Karnataka:      {adopted: false, notified_on: null,   deviations: "rules announced based on the Act; not a formal adoption"}
    Maharashtra:    {adopted: false, notified_on: null,   deviations: "rules announced based on the Act; not a formal adoption"}

[project]
name = "kwys"
version = "0.1.0"
description = "Know What You Sign - statistical deviation-based risk assessment of legal contract clauses for non-expert signatories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "krishnna-05"}]

# Core pipeline: ingestion, segmentation, extraction, statistics, CLI.
# Deliberately light so `uv sync` works in a minute and tests run without
# downloading a single model weight.
dependencies = [
    "pymupdf>=1.24",          # PDF text, per-span font/bbox metadata, and tables
    "pyyaml>=6.0",
    "pydantic>=2.7",          # typed Clause / Finding objects
    # The last Intel-Mac torch (2.2.2) was compiled against NumPy 1.x and fails
    # at import under NumPy 2 with a "_ARRAY_API not found" warning rather than a
    # clean error. Chain on this platform: Intel Mac -> torch 2.2.2 ->
    # transformers 4.x -> numpy 1.x. Every other platform is unconstrained.
    "numpy>=1.26,<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16.0",          # parquet corpus
    "duckdb>=1.0",            # corpus analytics
    "typer>=0.12",            # CLI
    "rich>=13.7",             # readable terminal output
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Everything that pulls a model weight. Installed separately so the core
# stays testable on a machine with no GPU and a slow connection.
ml = [
    # PyTorch dropped Intel-Mac wheels after 2.2.2 (2.14 ships macOS arm64 only),
    # so this machine pins to the last build that runs on it. Everywhere else —
    # Colab, Linux, Apple Silicon — gets a current torch. Training is CPU-only on
    # Intel Mac regardless: MPS acceleration is Apple-Silicon-only and PyTorch has
    # no ROCm/Metal path for the AMD Radeon in these machines.
    "torch>=2.2,<2.3; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch>=2.3; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    # transformers 5.x requires a torch newer than the last Intel-Mac build, and
    # silently degrades to "tokenizers only" rather than erroring. Pin to the 4.x
    # line on this platform; everywhere else takes the current release.
    "transformers>=4.44,<5; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "transformers>=4.44; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "datasets>=2.20",
    "accelerate>=0.33",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "spacy>=3.7",
]
ocr = [
    # RapidOCR runs on ONNX and needs no system binary, unlike Tesseract which
    # requires a brew/apt install. That matters for a project meant to be
    # deployable by someone without admin rights on their machine.
    # It MUST be declared here rather than installed ad-hoc: installing it
    # separately resolves numpy independently and silently upgrades past the
    # numpy<2 pin that torch 2.2.2 needs, which breaks torch's numpy interop
    # with a bare "Numpy is not available" at the first tensor conversion.
    "rapidocr-onnxruntime>=1.4",
    "opencv-python-headless>=4.10",
    "pillow>=10.3",
]
# The React interface in web/ is the front end; this extra is only the
# now-superseded Streamlit prototype, kept until the React one has been
# exercised properly. `serve` is what production needs.
ui = [
    "streamlit>=1.37",
    "altair>=5.3",
]
serve = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",      # property tests for unit normalisation
    "ruff>=0.6",
]

[project.scripts]
kwys = "kwys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kwys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection REQUIRES these in argument defaults - that is
# how the framework reads the request. B008 is a genuine warning for mutable
# defaults generally, but a false positive here.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
    "fastapi.Body", "fastapi.Header", "fastapi.Path",
    "File", "Form", "Depends", "Query", "Body", "Header",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# OCR tests take about a minute (model load plus recognition), which is long
# enough to discourage running the suite. They are excluded by default and run
# explicitly with `pytest -m slow` or in CI.
addopts = "-q -m 'not slow'"
markers = [
    "slow: tests that load a model or run OCR (deselected by default)",
]
